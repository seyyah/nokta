openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Nokta
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: support
    description: Human support chat operations
  - name: anthropic
    description: Anthropic AI chat operations
  - name: tasks
    description: Task management operations
  - name: projects
    description: Project management operations
  - name: agenda
    description: Agenda and calendar operations
  - name: mood
    description: Mood board and personalization operations
  - name: agents
    description: AI agent operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /support/sessions:
    post:
      operationId: createSupportSession
      tags: [support]
      summary: Create or resume a support session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"

  /support/sessions/{sessionId}/messages:
    get:
      operationId: getSupportMessages
      tags: [support]
      summary: Get messages for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a message in a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /support/admin/sessions:
    get:
      operationId: getAdminSessions
      tags: [support]
      summary: Get all support sessions (admin)
      responses:
        "200":
          description: All sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionsResponse"

  /support/admin/sessions/{sessionId}/reply:
    post:
      operationId: sendAdminReply
      tags: [support]
      summary: Send a reply as support agent (admin)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReplyRequest"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"

  /support/admin/sessions/{sessionId}/status:
    patch:
      operationId: updateSessionStatus
      tags: [support]
      summary: Update session status (admin)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task deleted

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /agenda:
    get:
      operationId: listAgendaEvents
      tags: [agenda]
      summary: List all agenda events
      responses:
        "200":
          description: List of agenda events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaEvent"
    post:
      operationId: createAgendaEvent
      tags: [agenda]
      summary: Create a new agenda event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgendaEventRequest"
      responses:
        "201":
          description: Created agenda event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaEvent"

  /mood:
    get:
      operationId: listMoodBoards
      tags: [mood]
      summary: List all mood boards
      responses:
        "200":
          description: List of mood boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoodBoard"
    post:
      operationId: createMoodBoard
      tags: [mood]
      summary: Create a new mood board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMoodBoardRequest"
      responses:
        "201":
          description: Created mood board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodBoard"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CreateSessionRequest:
      type: object
      properties:
        deviceId:
          type: string
        userName:
          type: string
      required: [deviceId]

    SupportSession:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        userName:
          type: string
        status:
          type: string
          enum: [open, active, closed]
        createdAt:
          type: integer
        updatedAt:
          type: integer
      required: [id, deviceId, userName, status, createdAt, updatedAt]

    SupportMessage:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        role:
          type: string
          enum: [user, agent]
        text:
          type: string
        createdAt:
          type: integer
      required: [id, sessionId, role, text, createdAt]

    SendMessageRequest:
      type: object
      properties:
        text:
          type: string
      required: [text]

    MessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"
        session:
          $ref: "#/components/schemas/SupportSession"
      required: [messages, session]

    AdminSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AdminSessionItem"
      required: [sessions]

    AdminSessionItem:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SupportSession"
        lastMessage:
          $ref: "#/components/schemas/SupportMessage"
        unreadCount:
          type: integer
      required: [session, unreadCount]

    AdminReplyRequest:
      type: object
      properties:
        text:
          type: string
      required: [text]

    UpdateStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, active, closed]
      required: [status]

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, createdAt]

    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]

    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
        agentType:
          type: string
      required: [title]

    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required: [content]

    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required: [id, title, createdAt, messages]

    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
        projectId:
          type: integer
        tags:
          type: array
          items:
            type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        checklist:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              completed:
                type: boolean
            required: [id, text, completed]
      required: [id, title, status, priority, createdAt, updatedAt, userId]

    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
        userId:
          type: string
        projectId:
          type: integer
        tags:
          type: array
          items:
            type: string
        checklist:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              completed:
                type: boolean
            required: [id, text, completed]
      required: [title, userId]

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        checklist:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              completed:
                type: boolean
            required: [id, text, completed]

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, completed, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        userId:
          type: string
        architecture:
          type: object
        roadmap:
          type: object
        memory:
          type: object
      required: [id, name, status, createdAt, updatedAt, userId]

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        userId:
          type: string
        architecture:
          type: object
        roadmap:
          type: object
      required: [name, userId]

    AgendaEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        recurring:
          type: object
        userId:
          type: string
        type:
          type: string
          enum: [event, task, reminder]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, date, userId, type, priority, createdAt, updatedAt]

    CreateAgendaEventRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        recurring:
          type: object
        userId:
          type: string
        type:
          type: string
          enum: [event, task, reminder]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        tags:
          type: array
          items:
            type: string
      required: [title, date, userId, type]

    MoodBoard:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        userId:
          type: string
        layout:
          type: object
        stickers:
          type: array
          items:
            type: object
        background:
          type: object
        theme:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, userId, theme, createdAt, updatedAt]

    CreateMoodBoardRequest:
      type: object
      properties:
        name:
          type: string
        userId:
          type: string
        layout:
          type: object
        stickers:
          type: array
          items:
            type: object
        background:
          type: object
        theme:
          type: string
      required: [name, userId, theme]

    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        personality:
          type: object
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, role, active, createdAt, updatedAt]

    CreateAgentRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        personality:
          type: object
      required: [name, role]
